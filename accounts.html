<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Київ Комун Сервіс - Рахунки</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <svg class="menu-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                    <svg class="close-icon hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="content-header-top">
                    <div class="content-title-wrapper">
                        <h1 class="header-title">Київ Комун Сервіс</h1>
                        <p class="user-subtitle">Особистий кабінет</p>
                    </div>  
                    <div class="back-home-wrapper">
                        <span class="divider">|</span>
                        <a href="index.html" class="back-home-link">На головну</a>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <p class="user-name">Олег Сігма</p>
                </div>
                <div class="user-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
    <div class="content-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            
            <div class="sidebar-card">
                <nav class="nav-menu">
                    <a href="profile.html" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Мій профіль і адреси</span>
                    </a>

                    <a href="accounts.html" class="nav-item active">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span>Особові рахунки і договори</span>
                    </a>

                    <a href="meters.html" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20M2 12l10-10 10 10"></path>
                        </svg>
                        <span>Лічильники</span>
                    </a>
                </nav>
            </div>

            
            <div class="sidebar-content">
                <h2 class="sidebar-title">Рахунки</h2>
                <button class="add-account-btn sidebar-add-account">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Додати рахунок
                </button>

                <div class="accounts-list" id="accountsList"></div>
            </div>


            <button class="mobile-logout-btn">Вийти</button>
        </aside>


            <!-- Main Content -->
            <main class="main-content">
                <div class="content-header">
                    <div class="content-header-top">
                        <div>
                            <h2 class="content-title" id="accountTitle"></h2>
                            <div class="content-meta" id="accountMeta"></div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs-container">
                        <nav class="tabs" id="tabs">
                            <button class="tab active" data-tab="overview">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                Огляд
                            </button>
                            <button class="tab" data-tab="bills">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                Нарахування
                            </button>
                            <button class="tab" data-tab="payment">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                    <line x1="1" y1="10" x2="23" y2="10"></line>
                                </svg>
                                Оплата
                            </button>
                            <button class="tab" data-tab="contract">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                                Договір
                            </button>
                        </nav>
                    </div>
                </div>

                
                <div class="tab-content" id="tabContent"></div>
            </main>
        </div>
    </div>

    <script src="js/accounts.js"></script>
</body>
</html>
