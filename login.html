<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Київ Комун Сервіс</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="my-gradient-bg">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Київ Комун Сервіс</h1>
            </div>
            <div class="login-body">
                <div class="login-form-wrapper">
                    <h2 class="login-title">Вхід до особистого кабінету</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label">Номер мобільного телефону</label>
                            <input type="tel" class="form-input" placeholder="+380 (xx)xxx-xx-xx" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Пароль</label>
                            <input type="password" class="form-input" required>
                            <div class="forgot-password">
                                <button type="button">Забули пароль?<br><span style="font-size: 0.75rem;"> </span></button>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">Увійти</button>
                        <p style="text-align: center; margin-top: 1rem; font-size: 0.875rem;">
                            Не маєте облікового запису? <button type="button" style="color: #2563eb; background: none; border: none; cursor: pointer;">Зареєструйтесь</button>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', 'Олег Сігма');

        
        const redirectPage = localStorage.getItem('redirectAfterLogin');

        if (redirectPage) {
            localStorage.removeItem('redirectAfterLogin');
            window.location.href = redirectPage;
        } else {
            
            window.location.href = 'profile.html';
        }
    });
    </script>
</body>
</html>
